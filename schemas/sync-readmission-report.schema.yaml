type: object
required:
  - schema
  - spec
  - status
  - result_code
additionalProperties: false
properties:
  schema:
    type: string
    const: sync-readmission-report/v1
  spec:
    type: string
    minLength: 1
  status:
    type: string
    enum: [ready, blocked]
  result_code:
    type: string
    minLength: 1
  detail:
    type: string
    minLength: 1
  transaction_id:
    type: string
    pattern: "^[0-9a-f]{64}$"
  provenance:
    type: string
    enum: [immutable, bootstrap-exception]
  implementation_baseline:
    type: string
    minLength: 1
  verified_head:
    type: string
    minLength: 1
  verified_tree:
    type: string
    pattern: "^[0-9a-f]{64}$"
  changed_paths:
    type: array
    items:
      type: string
      minLength: 1
  verify_gate_bundle:
    type: string
    minLength: 1
  verify_gate_sha256:
    type: string
    pattern: "^[0-9a-f]{64}$"
  source_evidence:
    type: object
    required:
      - baseline_bundle
      - baseline_sha256
      - verified_bundle
      - verified_sha256
      - verified_head
    additionalProperties: false
    properties:
      baseline_bundle:
        type: string
        pattern: "^gate-evidence/[0-9]{4,}-.+\\.yaml$"
      baseline_sha256:
        type: string
        pattern: "^[0-9a-f]{64}$"
      verified_bundle:
        type: string
        pattern: "^gate-evidence/[0-9]{4,}-.+\\.yaml$"
      verified_sha256:
        type: string
        pattern: "^[0-9a-f]{64}$"
      verified_head:
        type: string
        pattern: "^[0-9a-f]{40}$"
      dirty_tree_summary:
        type: object
        additionalProperties: false
        required: [files]
        properties:
          files_changed:
            type: [integer, "null"]
          insertions:
            type: [integer, "null"]
          deletions:
            type: [integer, "null"]
          files:
            type: array
            minItems: 1
            items:
              type: string
              minLength: 1
  owner_authorization:
    type: string
    minLength: 1
  derived_baseline:
    type: string
    minLength: 1
