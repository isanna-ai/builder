type: object
required: [artifact, ts, run_id, spec_id, phase, lane, memory_mode, plan_tokens_in, plan_tokens_out, plan_wall_ms, recall_calls, recall_hits, recall_latency_ms, decisions_reused, decisions_written, spec_outcome]
additionalProperties: false
properties:
  artifact:
    type: string
    const: memory_eval
  ts:
    type: string
    pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$
  run_id:
    type: string
    minLength: 1
  spec_id:
    type: string
    minLength: 1
  phase:
    type: string
    const: 4-plan
  lane:
    type: string
    enum: [claude, codex]
  memory_mode:
    type: string
    enum: ["off", hivemind, holographic]
  plan_tokens_in:
    type: integer
    minimum: 0
  plan_tokens_out:
    type: integer
    minimum: 0
  plan_wall_ms:
    type: integer
    minimum: 0
  recall_calls:
    type: integer
    minimum: 0
  recall_hits:
    type: integer
    minimum: 0
  recall_latency_ms:
    type: integer
    minimum: 0
  decisions_reused:
    type: integer
    minimum: 0
  decisions_written:
    type: integer
    minimum: 0
  prior_art_tokens:
    type: integer
    minimum: 0
  decisions_distilled:
    type: integer
    minimum: 0
  decisions_deduped:
    type: integer
    minimum: 0
  rubric_score:
    # Arm-blind LLM-judge plan-adherence score for this plan run, stored as the
    # 0.0-10.0 rubric mean times 10 (an integer in [0,100]; e.g. a 7.5 mean -> 75).
    # OPTIONAL + additive: old rows omit it (read as absent/0) and stay valid.
    type: integer
    minimum: 0
    maximum: 100
  recall_mode:
    type: string
    enum: [push, pull, hybrid, "off"]
  spec_outcome:
    type: string
    enum: [verified, failed, blocked, unknown]
