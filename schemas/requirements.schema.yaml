type: object
required: [artifact, title, spec, requirements]
properties:
  artifact:
    type: string
    const: requirements
  title:
    type: string
  spec:
    type: string
  requirements:
    type: array
    minItems: 1
    items:
      type: object
      required: [id, title, user_story, acceptance]
      properties:
        id:
          type: string
          pattern: ^R[0-9]+$
        title:
          type: string
        user_story:
          type: string
        acceptance:
          type: array
          minItems: 1
          # Each acceptance criterion is EITHER a legacy bare string (still fully
          # accepted) OR a structured object. `oneOf` documents both forms; the
          # structured object's field-level rules (id pattern, oracle.type enum,
          # priority) are surfaced as WARN-level advisories by the requirements
          # validator, never a hard schema error — so all-string specs stay valid.
          items:
            oneOf:
              - type: string
              - type: object
                required: [id, statement]
                properties:
                  id:
                    type: string
                    pattern: ^AC-R[0-9]+-[0-9]+$
                  statement:
                    type: string
                  observable_at:
                    type: string
                  oracle:
                    type: object
                    required: [type]
                    properties:
                      type:
                        type: string
                        enum: [automated_test, bounded_probe, human_only]
                      expected:
                        type: string
                  priority:
                    type: string
                    enum: [must, should]