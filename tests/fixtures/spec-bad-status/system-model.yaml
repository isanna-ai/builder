      statement: "Only support agents may reopen tickets"
      applies_to: [ACT1, CAP1, BND1]

how:
  behaviors:
    - capability: CAP1
      success: "Ticket status changes back to open"
      failures: [unauthorized]

upstream:
  sources: []

downstream:
  sinks: []