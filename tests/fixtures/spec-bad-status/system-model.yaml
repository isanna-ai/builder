version: 1

what:
  entities:
    - id: ENT1
      name: Ticket
  capabilities:
    - id: CAP1
      name: reopen_ticket

who:
  actors:
    - id: ACT1
      name: Agent
      capabilities: [CAP1]

when:
  events:
    - id: EVT1
      name: ticket_reopened
      trigger: "An agent reopens a closed ticket"

where:
  boundaries:
